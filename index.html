<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Netlify 結果檢視器</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0d10;color:#e9eef5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100vh;width:100vw;overflow:hidden;display:flex;flex-direction:column}

#uploadSection { padding: 40px 20px; max-width: 600px; margin: auto; width: 100%; }
h1{font-size:24px;margin:0 0 12px;text-align:center}
.card{background:#14181e;border:1px solid #28303a;border-radius:16px;padding:24px;text-align:center}
input[type="file"]{display:none}
.upload-btn{display:inline-block;padding:12px 24px;background:#e9eef5;color:#101318;font-weight:700;border-radius:10px;cursor:pointer;font-size:16px;width:100%}
.upload-btn:hover{background:#d0d7de}
.stats{margin-top:16px;font-size:14px;color:#8793a2;word-break:break-all}
.stats b{color:#7ee787}

#viewerSection { display: none; flex: 1; flex-direction: column; height: 100%; overflow: hidden; }

.view-area { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; overflow: hidden; position: relative; }

.screenshot-card {
  display: block;
  width: 100%;
  max-width: 1200px;
  height: 100%;
  background: #252c35;
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid #343e4a;
  cursor: pointer;
  text-decoration: none;
  position: relative;
  transition: border-color 0.2s;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}
.screenshot-card:hover { border-color: #7ee787; }
.thumbnail { width: 100%; height: 100%; object-fit: cover; object-position: top; }

.domain-label {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  background: linear-gradient(transparent, rgba(0,0,0,0.9));
  padding: 30px 20px 15px;
  color: #7ee787;
  font-family: ui-monospace, monospace;
  font-size: 20px;
  font-weight: bold;
  text-align: center;
  word-break: break-all;
}

.bottom-bar {
  width: 100%;
  background: #14181e;
  border-top: 1px solid #28303a;
  padding: 16px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

button{border:0;border-radius:8px;padding:10px 16px;background:#252c35;color:#e9eef5;font-weight:700;cursor:pointer;font-size:14px}
button:hover{background:#343e4a}
button:disabled{opacity:0.4;cursor:not-allowed}

.controls-center { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; }
.page-jump-container { display: flex; align-items: center; gap: 6px; }
.page-input { 
  width: 60px; 
  background: #0d1116; 
  color: #fff; 
  border: 1px solid #343e4a; 
  border-radius: 6px; 
  padding: 6px; 
  text-align: center; 
  font: inherit; 
  font-size: 16px;
  font-weight: bold;
}
.page-input::-webkit-outer-spin-button,
.page-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.page-input[type=number] { -moz-appearance: textfield; }
.small{font-size:14px;color:#8793a2}
</style>
</head>
<body>

<div id="uploadSection">
  <h1>Netlify 結果單張檢視器</h1>
  <section class="card">
    <label class="upload-btn">
      選取結果檔案 (index.html / report.html / .txt)
      <input type="file" id="fileInput" accept=".html,.txt">
    </label>
    <div class="stats" id="fileStats">尚未載入檔案</div>
  </section>
</div>

<div id="viewerSection">
  <div class="view-area" id="viewArea">
  </div>

  <div class="bottom-bar">
    <button id="prevBtn">上一頁</button>
    
    <div class="controls-center">
      <span class="small" style="color:#fff; font-weight:bold; margin-right:8px;">已發現站點</span>
      <div class="page-jump-container">
        <span class="small">第</span>
        <input type="number" id="pageInput" min="1" class="page-input">
        <span class="small" id="pageTotalIndicator">/ 1 個</span>
      </div>
    </div>

    <button id="nextBtn">下一頁</button>
  </div>
</div>

<script>
let domainList = [];
let currentIndex = 0; 
let preloadTimer = null; 

const fileInput = document.getElementById('fileInput');
const fileStats = document.getElementById('fileStats');
const uploadSection = document.getElementById('uploadSection');
const viewerSection = document.getElementById('viewerSection');
const viewArea = document.getElementById('viewArea');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const pageInput = document.getElementById('pageInput');
const pageTotalIndicator = document.getElementById('pageTotalIndicator');

fileInput.addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;

  fileStats.textContent = `讀取中 (${(file.size / 1024 / 1024).toFixed(2)} MB)...`;

  const reader = new FileReader();
  reader.onload = function(evt) {
    const content = evt.target.result;
    
    const matches = content.match(/([a-zA-Z0-9-]+)\.netlify\.app/g) || [];
    domainList = [...new Set(matches)];

    if (domainList.length === 0) {
      fileStats.textContent = `已讀取完成，但未在檔案中找到任何 .netlify.app 網址`;
      return;
    }

    uploadSection.style.display = 'none';
    viewerSection.style.display = 'flex';
    
    currentIndex = 0;
    renderItem();
  };

  reader.readAsText(file); //[span_1](start_span)[span_1](end_span)
});

function preloadImages(index) {
  // 如果超出陣列範圍就不處理
  if (index < 0 || index >= domainList.length) return; //[span_2](start_span)[span_2](end_span)
  const siteUrl = `https://${domainList[index]}`;
  const thumbnailUrl = `https://image.thum.io/get/width/1000/crop/2000/${siteUrl}`;
  const img = new Image();
  img.src = thumbnailUrl; //[span_3](start_span)[span_3](end_span)
}

function renderItem() {
  if (domainList.length === 0) return; //[span_4](start_span)[span_4](end_span)
  
  currentIndex = Math.max(0, Math.min(currentIndex, domainList.length - 1));
  
  const domain = domainList[currentIndex];
  const siteUrl = `https://${domain}`;
  const thumbnailUrl = `https://image.thum.io/get/width/1000/crop/2000/${siteUrl}`;
  const shortName = domain.replace('.netlify.app', '');

  viewArea.innerHTML = `
    <a href="${siteUrl}" target="_blank" rel="noopener" class="screenshot-card" title="點擊在新分頁開啟">
      <img class="thumbnail" src="${thumbnailUrl}" loading="lazy" alt="載入中..." onerror="this.style.display='none'">
      <div class="domain-label">${shortName}</div>
    </a>
  `;

  pageInput.value = currentIndex + 1;
  pageInput.max = domainList.length;
  pageTotalIndicator.textContent = `/ ${domainList.length.toLocaleString()} 個`;
  
  prevBtn.disabled = (currentIndex === 0);
  nextBtn.disabled = (currentIndex === domainList.length - 1);

  if (preloadTimer) clearTimeout(preloadTimer);
  
  // 延遲 1 秒後，開始預載左右各 5 個截圖
  preloadTimer = setTimeout(() => {
    for (let i = 1; i <= 5; i++) {
      preloadImages(currentIndex + i); // 預載下 i 個
      preloadImages(currentIndex - i); // 預載上 i 個
    }
  }, 1000);
}

function goPrev() {
  if (currentIndex > 0) {
    currentIndex--;
    renderItem();
  }
}

function goNext() {
  if (currentIndex < domainList.length - 1) {
    currentIndex++;
    renderItem();
  }
}

prevBtn.addEventListener('click', goPrev);
nextBtn.addEventListener('click', goNext);

pageInput.addEventListener('change', (e) => {
  let targetNum = parseInt(e.target.value, 10);
  
  if (isNaN(targetNum) || targetNum < 1) {
    targetNum = 1;
  } else if (targetNum > domainList.length) {
    targetNum = domainList.length;
  }

  if (currentIndex !== targetNum - 1) {
    currentIndex = targetNum - 1;
    renderItem();
  } else {
    e.target.value = currentIndex + 1;
  }
});

let touchstartX = 0;
let touchendX = 0;

viewArea.addEventListener('touchstart', e => {
  touchstartX = e.changedTouches[0].screenX;
});

viewArea.addEventListener('touchend', e => {
  touchendX = e.changedTouches[0].screenX;
  handleSwipe();
});

function handleSwipe() {
  const swipeThreshold = 50; 
  
  if (touchendX < touchstartX - swipeThreshold) {
    // 手指往左滑 (X 座標變小) -> 換到下一個
    goNext();
  } else if (touchendX > touchstartX + swipeThreshold) {
    // 手指往右滑 (X 座標變大) -> 回到上一個
    goPrev();
  }
}
</script>
</body>
</html>
